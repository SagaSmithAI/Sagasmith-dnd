[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sagasmith-dnd"
version = "0.2.0"
description = "D&D 5e 2014/2024 runtime and unified content-package CLI for SagaSmith Core"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SagaSmithAI" }]
dependencies = ["sagasmith-core>=0.2.0,<0.3.0"]

[project.optional-dependencies]
documents = ["sagasmith-core[documents]>=0.2.0,<0.3.0"]
images = [
    "pymupdf>=1.26.0,<2.0.0",
    "Pillow>=10.0.0,<13.0.0",
]
embedding = ["sagasmith-core[embedding]>=0.2.0,<0.3.0"]
vector = ["sagasmith-core[vector]>=0.2.0,<0.3.0"]
dense = ["sagasmith-core[embedding,vector]>=0.2.0,<0.3.0"]
all = [
    "sagasmith-core[documents,embedding,vector]>=0.2.0,<0.3.0",
    "pymupdf>=1.26.0,<2.0.0",
    "Pillow>=10.0.0,<13.0.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
sagasmith-dnd = "sagasmith_dnd.cli:main"

[project.entry-points."sagasmith.systems"]
dnd5e = "sagasmith_dnd.system:get_system"

[tool.hatch.build.targets.wheel]
packages = ["src/sagasmith_dnd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.uv.sources]
sagasmith-core = { path = "../../../sagasmith-core", editable = true }
