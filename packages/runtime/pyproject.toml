[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sagasmith-dnd-runtime"
version = "0.1.0"
description = "Protocol-independent D&D application services"
requires-python = ">=3.11"
dependencies = ["sagasmith-core>=0.2.3,<0.3.0", "sagasmith-dnd>=0.2.0,<0.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sagasmith_dnd_runtime"]

[tool.uv.sources]
sagasmith-core = { path = "../../../sagasmith-core", editable = true }
sagasmith-dnd = { workspace = true }
