[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sagasmith-dnd-mcp"
version = "0.1.0"
description = "Local MCP server for the SagaSmith D&D 5e runtime and skill packs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SagaSmithAI" }]
dependencies = [
    "mcp>=2.1.1,<3.0.0",
    "sagasmith-core>=0.2.0,<0.3.0",
    "sagasmith-dnd>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
documents = ["sagasmith-core[documents]>=0.2.0,<0.3.0"]
images = [
    "Pillow>=10.0.0,<13.0.0",
    "sagasmith-dnd[images]>=0.2.0,<0.3.0",
]
ocr = ["sagasmith-core[documents,ocr]>=0.2.0,<0.3.0"]
embedding = ["sagasmith-core[embedding]>=0.2.0,<0.3.0"]
vector = ["sagasmith-core[vector]>=0.2.0,<0.3.0"]
dense = ["sagasmith-core[embedding,vector]>=0.2.0,<0.3.0"]
all = [
    "sagasmith-core[documents,embedding,ocr,vector]>=0.2.0,<0.3.0",
    "sagasmith-dnd[images]>=0.2.0,<0.3.0",
    "Pillow>=10.0.0,<13.0.0",
]
gateway = ["aiohttp>=3.11.0,<4.0.0"]
dev = ["pytest>=9.0.0,<10.0.0", "ruff>=0.1.0"]

[project.scripts]
sagasmith-dnd-mcp = "sagasmith_dnd_mcp.server:main"
sagasmith-dnd-gateway = "sagasmith_dnd_mcp.gateway:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sagasmith_dnd_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "fresh_database: bypass the test database template to exercise real migration and seed startup",
    "full_agent: real-provider all-module Agent regression; opt in for nightly/full CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.uv.sources]
sagasmith-core = { path = "../../../sagasmith-core", editable = true }
sagasmith-dnd = { workspace = true }
